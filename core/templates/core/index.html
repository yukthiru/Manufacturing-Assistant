{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'core/style.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar topbar px-3">
  <span class="navbar-brand mb-0 h1">Manual Assistant</span>
  <div id="session" class="d-none d-flex align-items-center gap-3 text-white">
    <span id="who"></span>
    <button id="logout" class="btn btn-sm btn-outline-light">Sign out</button>
  </div>
</nav>

<main class="container py-4">
  <div id="alert"></div>

  <section id="login-view" class="d-none">
    <div class="card mx-auto" style="max-width:380px">
      <div class="card-body">
        <h2 class="h5 mb-3">Sign in</h2>
        <form id="login-form">
          <label class="form-label" for="username">Username</label>
          <input id="username" class="form-control mb-3" autocomplete="username" required>
          <label class="form-label" for="password">Password</label>
          <input id="password" type="password" class="form-control mb-3" autocomplete="current-password" required>
          <button class="btn btn-primary w-100">Sign in</button>
        </form>
      </div>
    </div>
  </section>

  <div id="app-view" class="d-none">
    <ul class="nav nav-pills mb-4" id="tabs"></ul>

    <!-- Administrator -->
    <section id="tab-admin" class="tab d-none">
      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card mb-4"><div class="card-body">
            <h2 class="h6">Register a machine</h2>
            <form id="machine-form" class="row g-2">
              <div class="col-12"><input id="m-name" class="form-control" placeholder="Name (e.g. Hydraulic Press)" required></div>
              <div class="col-12"><input id="m-model" class="form-control" placeholder="Model (e.g. HP-200)" required></div>
              <div class="col-12"><button class="btn btn-primary">Add machine</button></div>
            </form>
          </div></div>
          <div class="card"><div class="card-body">
            <h2 class="h6">Upload a manual</h2>
            <form id="manual-form" class="row g-2">
              <div class="col-12"><select id="u-machine" class="form-select" required></select></div>
              <div class="col-8"><input id="u-title" class="form-control" placeholder="Manual title" required></div>
              <div class="col-4"><input id="u-rev" class="form-control" placeholder="Revision" required></div>
              <div class="col-12"><input id="u-file" type="file" accept="application/pdf,.pdf" class="form-control" required></div>
              <div class="col-12"><button id="u-btn" class="btn btn-primary">Upload and index</button></div>
            </form>
          </div></div>
        </div>
        <div class="col-lg-7">
          <h2 class="h6">Uploaded manuals</h2>
          <div class="table-responsive"><table class="table table-sm align-middle">
            <thead><tr><th>Machine</th><th>Manual</th><th>Rev</th><th>Pages</th><th></th></tr></thead>
            <tbody id="manuals-body"></tbody>
          </table></div>
        </div>
      </div>
    </section>

    <!-- Engineer -->
    <section id="tab-ask" class="tab d-none">
      <form id="ask-form" class="mb-4">
        <label class="form-label" for="a-machine">Machine</label>
        <select id="a-machine" class="form-select mb-3" required></select>
        <label class="form-label" for="a-text">Maintenance question</label>
        <textarea id="a-text" rows="3" class="form-control mb-3" maxlength="1000" required
                  placeholder="e.g. How often should the hydraulic oil filter be replaced?"></textarea>
        <button id="a-btn" class="btn btn-primary">Ask</button>
      </form>
      <div id="answer"></div>
    </section>

    <!-- Engineer / Supervisor / Administrator -->
    <section id="tab-history" class="tab d-none">
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="h-unanswered">
        <label class="form-check-label" for="h-unanswered">Show unanswered only</label>
      </div>
      <div id="history"></div>
    </section>
  </div>
</main>
<script src="{% static 'core/app.js' %}"></script>
</body>
</html>
